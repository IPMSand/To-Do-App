<h3>To-Do Items</h3>
<div class="list-container" style="max-width: 1200px;">
  <ul nz-list [nzDataSource]="todoData" nzBordered nzSize="small">
    <nz-list-header>All</nz-list-header>

    @for (item of todoData; track item.id) {
      <li nz-list-item
          [nzActions]="[editAction, deleteAction]">

        <span nz-typography nzNoFlex [style.textDecoration]="item.isCompleted ? 'line-through' : 'none'">
          {{ item.taskName }}
        </span>
        <!-- <span nz-typography nzNoFlex [style.textDecoration]="item.isCompleted ? 'line-through' : 'none'">
          {{ item.isCreatedDay | date:'mediumDate' }}
        </span> -->
        <ng-template #editAction>
          <button (click)="emitToggle(item)">{{ item.isCompleted ? 'Undo' : 'Done'}}</button> 
          
        </ng-template>
        
        <ng-template #deleteAction>
          <button (click)="emitDelete(item.id)">delete</button>
        </ng-template>

      </li>
    }
  </ul>
</div>
